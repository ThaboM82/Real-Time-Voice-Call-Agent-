name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]
      exclude:
        - os: macos-latest
          node-version: 18
      include:
        - os: ubuntu-latest
          node-version: 22   # special experimental lint job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci
        working-directory: ./real-time-voice-agent

      - name: Run lint (root)
        run: npm run lint
        working-directory: ./real-time-voice-agent

  build-test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        project: [backend, frontend]
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]
      exclude:
        - os: macos-latest
          node-version: 18
      include:
        - project: backend
          os: ubuntu-latest
          node-version: 22   # special experimental backend job
        - project: frontend
          os: ubuntu-latest
          node-version: 22   # special experimental frontend job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./real-time-voice-agent/${{ matrix.project }}

      - name: Run tests
        run: npm test
        working-directory: ./real-time-voice-agent/${{ matrix.project }}

      - name: Build (frontend only)
        if: matrix.project == 'frontend'
        run: npm run build
        working-directory: ./real-time-voice-agent/frontend

      - name: Start backend (smoke test)
        if: matrix.project == 'backend'
        run: npm start &
        working-directory: ./real-time-voice-agent/backend

      - name: Health check
        if: matrix.project == 'backend'
        run: curl --fail http://localhost:3001/api/health

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: ./real-time-voice-agent

      - name: Run npm audit (warn only)
        run: |
          npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found, review required"
        working-directory: ./real-time-voice-agent

      - name: Secret scan
        uses: github/secret-scanning@v1
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: [build-test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy frontend to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: ./real-time-voice-agent/frontend

      - name: Deploy backend to Render
        uses: render-oss/render-action@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
