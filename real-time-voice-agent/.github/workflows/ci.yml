name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm install
        working-directory: ./real-time-voice-agent

      - name: Run lint (root)
        run: npm run lint
        working-directory: ./real-time-voice-agent

  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./real-time-voice-agent/backend

      - name: Run backend tests
        run: npm test
        working-directory: ./real-time-voice-agent/backend

      - name: Start backend (smoke test)
        run: npm start &
        working-directory: ./real-time-voice-agent/backend

      - name: Health check
        run: curl --fail http://localhost:3001/api/health

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./real-time-voice-agent/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./real-time-voice-agent/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: ./real-time-voice-agent/frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy frontend to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: ./real-time-voice-agent/frontend

      - name: Deploy backend to Render
        uses: render-oss/render-action@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}

