# Updated CI pipeline config
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json   # 👈 lock file inside backend

      - name: Install dependencies
        run: npm ci
        working-directory: backend   # 👈 install deps in backend

      - name: Lint code
        run: npm run lint
        working-directory: backend   # 👈 run lint in backend

      - name: Run tests
        run: npm test
        working-directory: backend   # 👈 run tests in backend

      - name: Build project
        run: npm run build
        working-directory: backend   # 👈 build backend

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/voice-agent:latest
